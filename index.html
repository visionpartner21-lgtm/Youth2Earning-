<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Youth2Earning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
    .card{background:#111827;margin:15px;padding:15px;border-radius:12px}
    h2{margin:0 0 8px}
    .val{font-size:22px;color:#38bdf8;font-weight:bold}
    button{width:100%;padding:12px;border:none;border-radius:8px;
      background:#22c55e;font-size:16px;margin-top:10px}
    input{width:100%;padding:10px;border-radius:6px;border:none}
  </style>
</head>
<body>

<div class="card">
  <h2>👤 User</h2>
  <div id="user">Guest</div>
</div>

<div class="card">
  <h2>💰 Balance</h2>
  <div class="val" id="bal">10 Coins</div>
</div>

<div class="card">
  <h2>👥 Referrals</h2>
  <div class="val">2 Users</div>
</div>

<div class="card">
  <h2>🔗 Referral Link</h2>
  <input value="https://t.me/youth2Earning_bot?start=ref123" readonly>
</div>

<div class="card">
  <h2>🎁 Daily Bonus</h2>
  <button onclick="bonus()">Claim Bonus</button>
</div>

<script>
  let tg = window.Telegram.WebApp;
  tg.ready();
  if(tg.initDataUnsafe.user){
    document.getElementById("user").innerText =
      tg.initDataUnsafe.user.first_name;
  }
  let bal = 10;
  function bonus(){
    bal += 3;
    document.getElementById("bal").innerText = bal + " Coins";
    alert("Bonus +3 Coins");
  }
</script>

</body>
</html>
